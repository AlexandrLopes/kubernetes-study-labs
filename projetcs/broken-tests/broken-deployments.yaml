apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: web-container
          image: nginx:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "64Mi"
              cpu: "250m"

#The selector app: web-app didn't match the Pod template label app: api-app. 
#The Deployment couldn't find its own Pods because the labels were different. 
#I fixed it by making both labels consistent
